<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opus Support Attendance | Applied AI</title>
<script>try{var t=localStorage.getItem("opus-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--ink:#15202E;--muted:#5A6577;--line:#D4DAE3;
  --accent:#2F5BD3;--accent-ink:#FFFFFF;
  --green:#1C8452;--green-bg:#DFF2E8;--red:#BF3428;--red-bg:#FAE3E0;
  --blk:#2A2F38;--blk-bg:#E1E4EA;--amber:#9A6200;--amber-bg:#FBEFD6;
  --zone-early:#BFE6D0;--zone-ok:#E6EAF0;--zone-late:#F4CBC5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151E;--surface:#182030;--ink:#E5EAF2;--muted:#98A3B5;--line:#2A3446;
  --accent:#6C8EF0;--accent-ink:#0E1420;
  --green:#5CC995;--green-bg:#173528;--red:#F07D72;--red-bg:#3A1D1B;
  --blk:#C9D0DC;--blk-bg:#2A3140;--amber:#E8B04F;--amber-bg:#352915;
  --zone-early:#1F4A35;--zone-ok:#263044;--zone-late:#4E2522;
}}
:root[data-theme="dark"]{
  --bg:#10151E;--surface:#182030;--ink:#E5EAF2;--muted:#98A3B5;--line:#2A3446;
  --accent:#6C8EF0;--accent-ink:#0E1420;
  --green:#5CC995;--green-bg:#173528;--red:#F07D72;--red-bg:#3A1D1B;
  --blk:#C9D0DC;--blk-bg:#2A3140;--amber:#E8B04F;--amber-bg:#352915;
  --zone-early:#1F4A35;--zone-ok:#263044;--zone-late:#4E2522;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* clock hero */
/* shift bar */
.shift-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.shift-head b{font-weight:600}
/* punch */
.punch{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.punch .state{font-size:15px}
.punch .state b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:13px 22px;font-size:16px}
.btn.ok{color:var(--green)}
.btn.no{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tallies */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tally div{border-radius:8px;padding:10px 12px}
.tally .n{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.tally .l{font-size:12.5px}
.t-g{background:var(--green-bg);color:var(--green)}
.t-r{background:var(--red-bg);color:var(--red)}
.t-b{background:var(--blk-bg);color:var(--blk)}
.t-a{background:var(--bg);border:1px solid var(--line)}
@media (max-width:520px){.tally{grid-template-columns:repeat(2,1fr)}}
/* chips & rows */
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.c-early{background:var(--green-bg);color:var(--green)}
.c-ontime{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.c-late{background:var(--red-bg);color:var(--red)}
.c-absent{background:var(--blk-bg);color:var(--blk)}
.c-pending{background:var(--amber-bg);color:var(--amber)}
.c-remote{background:var(--bg);color:var(--accent);border:1px solid var(--line)}
.c-off,.c-na{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rows td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rows tr:last-child td{border-bottom:0}
.rows td.num,.rows th.num{text-align:right}
.scroll{overflow-x:auto}
.flag{font-size:11.5px;color:var(--amber)}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.empty{color:var(--muted);padding:12px 0}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ===== merged pages ===== */
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.help-btn{border-radius:999px;width:32px;height:32px;padding:0;font-weight:600;flex:none}
.sec-h{font-size:15px;font-weight:600;margin:18px 0 10px}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.sec-row .sec-h{margin:12px 0 10px}
.today-month{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.fold>summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2{margin:0}
.fold>summary::after{content:"Show";font-size:12.5px;color:var(--muted)}
.fold[open]>summary::after{content:"Hide"}
.fold[open]>summary{margin-bottom:12px}
.hero.is-over{outline:3px solid var(--red);outline-offset:-3px}
.hero.is-over .brk-time{color:inherit}
.hero .brk-time{margin-top:8px}
.hero-btn{display:flex;gap:8px;flex-wrap:wrap}
.pc-set{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pc-set .seg-b{padding:4px 10px;font-size:12.5px}
.seg-b:disabled{cursor:default}
.tour-text{font-size:15.5px;line-height:1.55;margin:0 0 16px}
.tour-dots{display:flex;gap:6px}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--accent)}
</style>
<style>
[hidden]{display:none!important}
.btn.small{padding:5px 10px;font-size:13px}
.logo{display:block;height:28px;width:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn .sw{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.theme-btn .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s}
.theme-btn[aria-pressed="true"] .sw{background:var(--accent)}
.theme-btn[aria-pressed="true"] .sw::after{left:14px}
.login-top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
@media (prefers-reduced-motion:reduce){.theme-btn .sw,.theme-btn .sw::after{transition:none}}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{width:100%;max-width:400px}
.login-card .logo{height:44px;margin-bottom:36px}
.login-card h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.login-card p.lead{color:var(--muted);margin:0 0 26px}
.login-card label.f{margin-bottom:12px}
.login-card .btn{width:100%}
.code{font-size:26px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:10px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13.5px;margin-top:14px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--amber-bg);color:var(--amber);font-size:13.5px;border-bottom:1px solid var(--line)}
.demo-bar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;margin-left:6px}
.demo-bar .chk{font-size:13.5px}
label.btn{display:inline-block}
.edit td:first-child{white-space:nowrap;padding-right:10px}
.edit td,.edit th{padding:6px 4px}
.edit .inl{padding:6px 6px;font-size:13.5px}
.edit input[type=date]{width:132px}
.alertbar{background:var(--red-bg);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-weight:500}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pcard.st-available{border-left-color:var(--green)}
.pcard.st-break{border-left-color:var(--amber)}
.pcard.st-over{border-left-color:var(--red);background:var(--red-bg)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-available{background:var(--green-bg);color:var(--green)}
.p-break{background:var(--amber-bg);color:var(--amber)}
.p-over{background:var(--red);color:#fff}
.p-notin,.p-done,.p-off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pc-timer{font-variant-numeric:tabular-nums;font-weight:500}
.is-over .pc-timer,.is-over .brk-time{color:var(--red)}
.brk-time{font-size:40px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.brk.is-over{background:var(--red-bg);border-color:var(--red)}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side-head{font-size:12px;color:var(--muted);padding:10px 10px 4px}
.side-head:first-child{padding-top:4px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink);cursor:pointer;font-weight:500}
.side button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.side button:hover{background:var(--bg)}
.side button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.side button[aria-selected="true"] svg{color:var(--accent-ink)}
.side button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  .side{order:-1;position:static;flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side-head{display:none}
  .side button{width:auto;white-space:nowrap;padding:8px 10px}
}
.dlg{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(560px,calc(100vw - 32px))}
.dlg::backdrop{background:rgba(10,14,22,.55)}
.dlg h2{font-size:19px;margin:0 0 16px}
.dlg-x{position:absolute;top:14px;right:14px;margin:0}
.bcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--ink);text-align:left}
.bcard:hover:not(:disabled){border-color:var(--accent)}
.bcard:disabled{opacity:.45;cursor:not-allowed}
.bc-min{font-size:34px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.bc-min small{font-size:14px;margin-left:3px;color:var(--muted)}
.bc-t{font-weight:600;margin-top:6px}
.bc-left{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.bcards{grid-template-columns:1fr}}
.ms-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.ms-hero,.ms-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ms-hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms-hero .muted{color:inherit;opacity:.8}
.ms-big{font-size:28px;font-weight:500;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.ms-stat .n{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.ms-stat .l{font-size:12.5px}
@media (max-width:640px){.ms-top{grid-template-columns:1fr 1fr 1fr}.ms-hero{grid-column:1/-1}}
.ms-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ms-nav .btn{font-size:18px;line-height:1;padding:4px 12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.cal-d.empty{border:0;background:none}
.cal-d.off{background:var(--bg)}
.cal-d.past{opacity:.55}
.cal-d.today{border:2px solid var(--accent);opacity:1}
.cal-n{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.cal-dot{width:8px;height:8px;border-radius:50%}
.cal-dot.off{background:var(--green)}
.cal-dot.rem{background:var(--accent)}
.cal-pill{border-radius:7px;padding:4px 6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.25}
.cal-pill .to{font-weight:400;opacity:.8}
.cal-off{font-size:12px;color:var(--muted)}
.s1,.ocell.mo.s1{background:#DCE7FF;color:#1D3F9E}.s2,.ocell.mo.s2{background:#EADFFB;color:#5A2CA0}.s3,.ocell.mo.s3{background:#D5F1EC;color:#0F6455}
:root[data-theme="dark"] .s1,:root[data-theme="dark"] .ocell.mo.s1{background:#1E2D55;color:#B9CCFF}:root[data-theme="dark"] .s2,:root[data-theme="dark"] .ocell.mo.s2{background:#33244F;color:#D8C4FA}:root[data-theme="dark"] .s3,:root[data-theme="dark"] .ocell.mo.s3{background:#163C36;color:#A6E6DA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s1,:root:not([data-theme="light"]) .ocell.mo.s1{background:#1E2D55;color:#B9CCFF}:root:not([data-theme="light"]) .s2,:root:not([data-theme="light"]) .ocell.mo.s2{background:#33244F;color:#D8C4FA}:root:not([data-theme="light"]) .s3,:root:not([data-theme="light"]) .ocell.mo.s3{background:#163C36;color:#A6E6DA}}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted)}

.item.is-over{color:var(--red)}

.audit td{vertical-align:top}

/* ===== Modern refresh ===== */
.dayed{position:fixed;z-index:50;width:min(460px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.08);padding:16px 18px}

.de-sec{padding:12px 0;border-top:1px solid var(--line)}
.de-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.seg-b:hover{border-color:var(--ink)}

.de-sec .inl{width:100%}
.de-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}

:root{--bg:#F4F5F7;--surface:#FFFFFF;--ink:#0B1220;--muted:#667085;--line:#E4E7EC;--accent:#111827;--accent-ink:#FFFFFF;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);

/* ===== Guide ===== */
@media (max-width:640px){.gd-r{grid-template-columns:1fr;gap:2px}}
/* ===== Schedule rules ===== */
.score{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.score.ok{background:var(--green-bg);color:var(--green)}.score.mid{background:var(--amber-bg);color:var(--amber)}.score.bad{background:var(--red-bg);color:var(--red)}
.chk{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--bg)}
.chk summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--red)}
.rd-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.rd-item:first-of-type{border-top:0}
.rd-h{display:flex;justify-content:space-between;gap:10px}
.rd-rule{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red)}
.rd-fix{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#rdList{max-height:50vh;overflow:auto}
.mo-c.bad .ocell.mo{box-shadow:0 0 0 2px var(--red)}
.mo-h.bad b{color:var(--red)}
.mo-h.bad::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--red);margin:2px auto 0}
.pc-title{font-size:12px;font-weight:600;color:var(--muted);margin:-2px 0 2px 40px}
.stack-12{display:flex;flex-direction:column;gap:10px;margin-top:12px}
/* ===== Weekly plan & employees ===== */
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.plan-t{border-collapse:separate;border-spacing:0 6px;width:100%}
.plan-t th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 6px}
.plan-t th.bad{color:var(--red)}
.plan-t td{padding:0 6px;vertical-align:middle}
.plan-t td:first-child{white-space:nowrap;padding-right:14px}
.plan-t .mo-cnt{margin-left:40px}
.plan-t .inl{padding:6px 8px;font-size:13px}
.pl-d{width:100%;min-width:74px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 6px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pl-d:hover{border-color:var(--ink)}
.pl-d.rem{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pl-issues{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--red-bg);display:flex;flex-direction:column;gap:4px;font-size:13px}
.emp-list{display:flex;flex-direction:column}
.emp-row{display:grid;grid-template-columns:30px minmax(160px,1.2fr) minmax(0,1.4fr) minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:8px}
.emp-row:first-child{border-top:0}
.emp-row:hover{background:var(--bg)}
.emp-main{display:flex;flex-direction:column;line-height:1.3}
.emp-meta{display:flex;gap:6px;flex-wrap:wrap}
.emp-mail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp-mail.warn{color:var(--amber)}
.emp-go{font-size:12.5px;font-weight:600;color:var(--muted)}
.emp-dlg{width:min(560px,calc(100vw - 32px))}
.ed-sec{padding:14px 0;border-top:1px solid var(--line)}
.ed-sec:first-of-type{border-top:0}
@media (max-width:760px){.emp-row{grid-template-columns:30px 1fr auto}.emp-meta,.emp-mail{display:none}}
:root[data-theme="dark"] .pl-d{background:var(--surface2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl-d{background:var(--surface2)}}
:root[data-theme="dark"] .pl-d.rem{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl-d.rem{background:var(--accent);color:var(--accent-ink)}}
/* ===== Settings tabs & guide v2 ===== */
.set-tabs{margin-bottom:14px}
/* ===== Guide v3 ===== */
.g-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.g-top .inl{flex:1;min-width:220px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.fl{display:flex;flex-direction:column;gap:2px;padding:16px;border-left:1px solid var(--line);position:relative}
.fl:first-child{border-left:0}
.fl-n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:6px}
.fl b{font-size:14.5px}.fl span:last-child{font-size:12.5px;color:var(--muted)}
.gx{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.pts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pt{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--bg)}
.pt-b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pt b{font-size:13px}.pt span:last-child{font-size:12px;color:var(--muted);line-height:1.35}
.pt.ok .pt-b{color:var(--muted)}.pt.mid .pt-b{color:var(--amber)}.pt.red .pt-b{color:var(--red)}.pt.blk .pt-b{color:var(--blk)}.pt.green .pt-b{color:var(--green)}
.tcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.tc h3{margin:10px 0 6px;font-size:15px}
.tc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tc li{font-size:13.5px;line-height:1.45;padding-left:14px;position:relative}
.tc li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.tc-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.tc-i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pl-dates{display:flex;gap:10px;flex-wrap:wrap}
.pl-dates .inl{padding:6px 8px}
.acc-full{color:var(--ink);font-weight:600}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr}.fl:nth-child(3){border-left:0}.fl:nth-child(n+3){border-top:1px solid var(--line)}.pts{grid-template-columns:1fr 1fr}}
:root[data-theme="dark"] .pt,:root[data-theme="dark"] .tc-i{background:var(--surface2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pt,:root:not([data-theme="light"]) .tc-i{background:var(--surface2)}}
/* ===== Motion ===== */
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes cardChange{0%{transform:scale(1)}20%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(127,127,127,.45)}100%{box-shadow:0 0 0 12px rgba(127,127,127,0)}}
.pagehead.pg-in{animation:pgIn .28s cubic-bezier(.2,.7,.2,1) both}
#main.pg-in>*{animation:pgIn .36s cubic-bezier(.2,.7,.2,1) both}
#main.pg-in>*:nth-child(2){animation-delay:.05s}#main.pg-in>*:nth-child(3){animation-delay:.1s}#main.pg-in>*:nth-child(4){animation-delay:.15s}#main.pg-in>*:nth-child(5){animation-delay:.2s}#main.pg-in>*:nth-child(n+6){animation-delay:.24s}
.dayed:not([hidden]){animation:popIn .18s cubic-bezier(.2,.8,.2,1)}
.dayed.sheet:not([hidden]){animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
dialog.dlg[open]{animation:popIn .2s cubic-bezier(.2,.8,.2,1)}
dialog.dlg[open]::backdrop{animation:fadeIn .2s ease}
.alertbar:not([hidden]){animation:slideDown .3s ease}
#toast{transform:translate(-50%,12px);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
#toast.show{transform:translate(-50%,0)}
.btn,.seg-b,.bcard,.side button,.ocell,.bl-pill,.pill,.chip,.mode-chip,.pcard,.panel,.tally div{transition:background-color .18s ease,border-color .18s ease,color .18s ease,opacity .22s ease,transform .14s ease,box-shadow .2s ease}
.btn:active:not(:disabled),.seg-b:active,.side button:active,.ocell:active{transform:scale(.96)}
.bcard:hover:not(:disabled){transform:translateY(-2px)}
.bcard:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled,.bcard:disabled{transform:none}
.pcard.changed{animation:cardChange .5s ease,ring .9s ease-out}
.bl-dots i{transition:background-color .3s,border-color .3s}
.seg-b.on{animation:popIn .16s ease}
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease,fill .4s ease!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  <div class="actions"><button class="btn" id="rdCancel">Go back</button><button class="btn no" id="rdAnyway">Save anyway</button></div>

<dialog id="tourDlg" class="dlg" aria-label="Quick tour"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
