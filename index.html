<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opus Support Attendance | Applied AI</title>
<script>try{var t=localStorage.getItem("opus-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--ink:#15202E;--muted:#5A6577;--line:#D4DAE3;
  --accent:#2F5BD3;--accent-ink:#FFFFFF;
  --green:#1C8452;--green-bg:#DFF2E8;--red:#BF3428;--red-bg:#FAE3E0;
  --blk:#2A2F38;--blk-bg:#E1E4EA;--amber:#9A6200;--amber-bg:#FBEFD6;
  --zone-early:#BFE6D0;--zone-ok:#E6EAF0;--zone-late:#F4CBC5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151E;--surface:#182030;--ink:#E5EAF2;--muted:#98A3B5;--line:#2A3446;
  --accent:#6C8EF0;--accent-ink:#0E1420;
  --green:#5CC995;--green-bg:#173528;--red:#F07D72;--red-bg:#3A1D1B;
  --blk:#C9D0DC;--blk-bg:#2A3140;--amber:#E8B04F;--amber-bg:#352915;
  --zone-early:#1F4A35;--zone-ok:#263044;--zone-late:#4E2522;
}}
:root[data-theme="dark"]{
  --bg:#10151E;--surface:#182030;--ink:#E5EAF2;--muted:#98A3B5;--line:#2A3446;
  --accent:#6C8EF0;--accent-ink:#0E1420;
  --green:#5CC995;--green-bg:#173528;--red:#F07D72;--red-bg:#3A1D1B;
  --blk:#C9D0DC;--blk-bg:#2A3140;--amber:#E8B04F;--amber-bg:#352915;
  --zone-early:#1F4A35;--zone-ok:#263044;--zone-late:#4E2522;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:28px;height:28px;border-radius:50%}
.role{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:8px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* clock hero */
.clock{padding:6px 0 18px}
.clock .date{color:var(--muted);font-size:14px}
.clock .time{font-weight:300;font-size:clamp(56px,16vw,92px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.src{font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.src i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.src.dev i{background:var(--amber)}
/* shift bar */
.shift-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.shift-head b{font-weight:600}
.bar{position:relative;height:44px;border-radius:6px;overflow:hidden;background:var(--zone-ok)}
.bar .z{position:absolute;top:0;bottom:0}
.bar .z.e{background:var(--zone-early)}
.bar .z.l{background:var(--zone-late)}
.bar .needle{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);transform:translateX(-1px)}
.bar .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-7px,-7px)}
.ticks{position:relative;height:18px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);top:3px;white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.rules{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.rules em{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* punch */
.punch{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.punch .state{font-size:15px}
.punch .state b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:13px 22px;font-size:16px}
.btn.ok{color:var(--green)}
.btn.no{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tallies */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tally div{border-radius:8px;padding:10px 12px}
.tally .n{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.tally .l{font-size:12.5px}
.t-g{background:var(--green-bg);color:var(--green)}
.t-r{background:var(--red-bg);color:var(--red)}
.t-b{background:var(--blk-bg);color:var(--blk)}
.t-a{background:var(--bg);border:1px solid var(--line)}
@media (max-width:520px){.tally{grid-template-columns:repeat(2,1fr)}}
/* chips & rows */
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.c-early{background:var(--green-bg);color:var(--green)}
.c-ontime{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.c-late{background:var(--red-bg);color:var(--red)}
.c-absent{background:var(--blk-bg);color:var(--blk)}
.c-leave,.c-pending{background:var(--amber-bg);color:var(--amber)}
.c-remote{background:var(--bg);color:var(--accent);border:1px solid var(--line)}
.c-off,.c-future,.c-na{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.c-approved{background:var(--green-bg);color:var(--green)}
.c-rejected{background:var(--red-bg);color:var(--red)}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rows td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rows tr:last-child td{border-bottom:0}
.rows td.num,.rows th.num{text-align:right}
.scroll{overflow-x:auto}
.person{display:flex;align-items:center;gap:8px;min-width:140px}
.person img{width:24px;height:24px;border-radius:50%}
.flag{font-size:11.5px;color:var(--amber)}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.notice{padding:14px 16px;border-radius:10px;background:var(--amber-bg);color:var(--amber)}
.empty{color:var(--muted);padding:12px 0}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.stack>*+*{margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
textarea.csv{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
<style>
[hidden]{display:none!important}
.btn.small{padding:5px 10px;font-size:13px}
.logo{display:block;height:28px;width:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn .sw{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.theme-btn .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s}
.theme-btn[aria-pressed="true"] .sw{background:var(--accent)}
.theme-btn[aria-pressed="true"] .sw::after{left:14px}
.login-top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
@media (prefers-reduced-motion:reduce){.theme-btn .sw,.theme-btn .sw::after{transition:none}}
header.top .brand{display:flex;align-items:center;gap:14px}
header.top .brand small{display:inline;border-left:1px solid var(--line);padding-left:14px;font-size:13px}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-card{width:100%;max-width:400px}
.login-card .logo{height:44px;margin-bottom:36px}
.login-card h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.login-card p.lead{color:var(--muted);margin:0 0 26px}
.login-card label.f{margin-bottom:12px}
.login-card .btn{width:100%}
.code{font-size:26px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:10px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13.5px;margin-top:14px}
.sched th,.sched td{padding:6px 5px}
.sched td:first-child,.sched th:first-child{position:sticky;left:0;background:var(--surface);white-space:nowrap}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--amber-bg);color:var(--amber);font-size:13.5px;border-bottom:1px solid var(--line)}
.demo-bar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;margin-left:6px}
.demo-bar .chk{font-size:13.5px}
.schedimg{display:block;max-width:100%;max-height:70vh;border-radius:6px;border:1px solid var(--line)}
.cell{border:0;background:none;font:inherit;font-size:12.5px;padding:3px 2px;min-width:28px;border-radius:4px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.cell:hover{background:var(--bg)}
.cell.c-set{font-weight:600}
.cell.c-def{color:var(--muted)}
.cell.c-off{color:var(--muted);text-decoration:line-through}
label.btn{display:inline-block}
.edit td:first-child{white-space:nowrap;padding-right:10px}
.edit td,.edit th{padding:6px 4px}
.edit .inl{padding:6px 6px;font-size:13.5px}
.edit input[type=date]{width:132px}
.alertbar{background:var(--red-bg);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-weight:500}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pcard.st-available{border-left-color:var(--green)}
.pcard.st-break{border-left-color:var(--amber)}
.pcard.st-over{border-left-color:var(--red);background:var(--red-bg)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-available{background:var(--green-bg);color:var(--green)}
.p-break{background:var(--amber-bg);color:var(--amber)}
.p-over{background:var(--red);color:#fff}
.p-notin,.p-done,.p-off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pc-timer{font-variant-numeric:tabular-nums;font-weight:500}
.is-over .pc-timer,.is-over .brk-time{color:var(--red)}
.brk-time{font-size:40px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.brk.is-over{background:var(--red-bg);border-color:var(--red)}
.wrap{max-width:1180px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side-head{font-size:12px;color:var(--muted);padding:10px 10px 4px}
.side-head:first-child{padding-top:4px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink);cursor:pointer;font-weight:500}
.side button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.side button:hover{background:var(--bg)}
.side button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.side button[aria-selected="true"] svg{color:var(--accent-ink)}
.side button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:12px}
  .side{order:-1;position:static;flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side-head{display:none}
  .side button{width:auto;white-space:nowrap;padding:8px 10px}
}
.dlg{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(560px,calc(100vw - 32px))}
.dlg::backdrop{background:rgba(10,14,22,.55)}
.dlg h2{font-size:19px;margin:0 0 16px}
.dlg-x{position:absolute;top:14px;right:14px;margin:0}
.ci-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ci-opt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--ink)}
.ci-opt:hover:not(:disabled){border-color:var(--accent)}
.ci-opt:disabled{opacity:.5;cursor:wait}
.ci-opt svg{width:30px;height:30px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.ci-opt b{font-size:17px}
.ci-opt span{font-size:13px;color:var(--muted)}
@media (max-width:520px){.ci-opts{grid-template-columns:1fr}}
.bcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--ink);text-align:left}
.bcard:hover:not(:disabled){border-color:var(--accent)}
.bcard:disabled{opacity:.45;cursor:not-allowed}
.bc-min{font-size:34px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.bc-min small{font-size:14px;margin-left:3px;color:var(--muted)}
.bc-t{font-weight:600;margin-top:6px}
.bc-left{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.bcards{grid-template-columns:1fr}}
.ms-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.ms-hero,.ms-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ms-hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms-hero .muted{color:inherit;opacity:.8}
.ms-big{font-size:28px;font-weight:500;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.ms-stat .n{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.ms-stat .l{font-size:12.5px}

.cal-pill .to{font-weight:400;opacity:.8}
.cal-off{font-size:12px;color:var(--muted)}
.s1{background:#DCE7FF;color:#1D3F9E}.s2{background:#EADFFB;color:#5A2CA0}.s3{background:#D5F1EC;color:#0F6455}

.cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.cal-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}

.item.is-over{color:var(--red)}
@media (max-width:640px){header.top{flex-wrap:wrap}header.top .brand small{display:none}.who{flex-wrap:wrap;justify-content:flex-end;gap:6px}}

.sk-n small{font-size:14px;color:var(--muted);margin-left:4px}
.sk-badge{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.streak.done .sk-badge{background:var(--green);border-color:var(--green);color:#fff}
.sk-bar{height:8px;border-radius:999px;background:var(--bg);margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.sk-bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.ocell{border:0;background:none;font:inherit;font-size:12.5px;padding:3px 2px;min-width:30px;border-radius:5px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.ocell:hover{background:var(--bg);outline:1px solid var(--line)}
.ocell.off{color:var(--muted)}
.ocell.faded{opacity:.55}
.ocell.exc{background:var(--blk-bg);color:var(--accent);font-weight:600}
.cal-exc{font-size:12px;font-weight:600;color:var(--accent);background:var(--bg);border:1px dashed var(--accent);border-radius:7px;padding:4px 6px}
.nowrap{white-space:nowrap}
.audit td{vertical-align:top}
.pcard.st-busy{border-left-color:var(--muted)}
.p-busy{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.bcards.two{grid-template-columns:repeat(2,1fr)}
.bcard.work .bc-ico svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tally{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
footer.foot{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}

/* ===== Modern refresh ===== */
.shiftcd{margin-top:14px;max-width:420px}
.cd-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.cd-txt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cd-pct{font-size:12.5px;opacity:.7}
.cd-bar{height:6px;border-radius:999px;background:rgba(127,127,127,.25);overflow:hidden}
.cd-bar i{display:block;height:100%;width:0;border-radius:999px;background:currentColor;transition:width .4s}
.sb-shift{padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.shiftcd.mini{margin-top:4px}
.shiftcd.mini .cd-txt{font-size:13.5px}
.shiftcd.mini .cd-bar{height:4px}
.shiftcd.mini .cd-bar i{background:var(--ink)}
.bl{display:grid;grid-template-columns:repeat(3,max-content);gap:6px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.bl-h{grid-column:1/-1;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bl-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.bl-pill b{font-weight:600;font-variant-numeric:tabular-nums}
.bl-dots{display:inline-flex;gap:3px}
.bl-dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.bl-dots i.on{background:var(--green);border-color:var(--green)}
.bl-pill.none{opacity:.5}
.bl-pill.none b{text-decoration:line-through}
:root{--bg:#F4F5F7;--surface:#FFFFFF;--ink:#0B1220;--muted:#667085;--line:#E4E7EC;--accent:#111827;--accent-ink:#FFFFFF;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --green:#12805C;--green-bg:#E3F5EC;--red:#C2362B;--red-bg:#FDECEA;--blk:#1F2937;--blk-bg:#E9ECF1;--amber:#946200;--amber-bg:#FDF3DC;
  --zone-early:#BFE8D3;--zone-ok:#ECEFF3;--zone-late:#F7D1CC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F17;--surface:#131A27;--ink:#E7EBF3;--muted:#95A1B5;--line:#242D3D;--accent:#F2F4F7;--accent-ink:#0B0F17;--shadow:0 0 0 transparent;
  --green:#5FD3A0;--green-bg:#14301F;--red:#F38B80;--red-bg:#3A1C1A;--blk:#D3D9E4;--blk-bg:#232B3A;--amber:#EDB653;--amber-bg:#33270F;--zone-early:#1E4A36;--zone-ok:#222B3B;--zone-late:#4C2422}}
:root[data-theme="dark"]{--bg:#0B0F17;--surface:#131A27;--ink:#E7EBF3;--muted:#95A1B5;--line:#242D3D;--accent:#F2F4F7;--accent-ink:#0B0F17;--shadow:0 0 0 transparent;
  --green:#5FD3A0;--green-bg:#14301F;--red:#F38B80;--red-bg:#3A1C1A;--blk:#D3D9E4;--blk-bg:#232B3A;--amber:#EDB653;--amber-bg:#33270F;--zone-early:#1E4A36;--zone-ok:#222B3B;--zone-late:#4C2422}
body{font-size:14.5px;letter-spacing:-.003em}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px 16px;background:var(--surface);border-right:1px solid var(--line)}
.sb-logo{display:flex;flex-direction:column;gap:10px;padding:0 8px}
.sb-logo .logo{height:24px;width:auto;align-self:flex-start}
.sb-logo span{font-size:12px;color:var(--muted);line-height:1.35}
.sidebar .side{position:static;border:0;background:none;padding:0;border-radius:0;flex:1;overflow-y:auto;gap:2px}
.side-head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.side button{border-radius:10px;padding:9px 10px;font-weight:500;color:var(--ink)}
.side button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.sb-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sb-user{display:flex;align-items:center;gap:10px;padding:0 6px}
.sb-user .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.sb-user .rl{font-size:12px;color:var(--muted)}
.sb-actions{display:flex;gap:6px;flex-wrap:wrap}
.content{padding:28px 36px 48px;min-width:0;max-width:1180px;width:100%}
.pagehead{margin-bottom:20px}
.pagehead h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.panel{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px}
.btn{border-radius:10px;font-weight:500;transition:background .12s,border-color .12s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.9}
.tally{gap:12px}
.tally div{border-radius:12px;padding:12px 14px}
.tally .n{font-size:28px;font-weight:600;letter-spacing:-.02em}
.chip{border-radius:999px;padding:3px 10px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:26px 28px;margin-bottom:14px}
.hero .date{opacity:.7;font-size:14px}
.hero .time{font-weight:300;font-size:clamp(52px,7vw,84px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 10px}
.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;opacity:.9}
.hero-r{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.hero .state{font-size:15.5px;line-height:1.5}
.hero .state .muted{color:inherit;opacity:.7}
.hero .btn{border-color:transparent}
.hero .btn.primary{background:var(--accent-ink);color:var(--accent)}
.hero .btn:not(.primary){background:rgba(255,255,255,.12);color:inherit;border:1px solid rgba(255,255,255,.25)}
:root[data-theme="dark"] .hero .btn:not(.primary){background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .btn:not(.primary){background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}}
.hero .btn:disabled{opacity:.55}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.hero .mode-chip{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.25)}
.mode-chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11.5px;font-weight:700;flex:none;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 50% 28%)}
:root[data-theme="dark"] .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 85%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 35% 24%);color:hsl(var(--h) 70% 85%)}}
.avn{display:inline-flex;align-items:center;gap:10px;font-weight:500}
.flag-red{font-size:12px;color:var(--red);font-weight:500;margin-top:3px}
.ot-row{display:flex;gap:8px;flex-wrap:wrap}
.ot-row .inl{flex:1;min-width:140px}
.ot-row select.inl{flex:0 0 auto}
.cal-mode{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ocell sup{font-size:9px;margin-left:1px;color:var(--muted)}
.rows tr.review td{background:var(--red-bg)}
.alertbar.soft{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.pcard{border-radius:14px;border-left-width:1px;box-shadow:var(--shadow);padding:14px 16px}
.pcard,.pcard.st-available,.pcard.st-break,.pcard.st-over,.pcard.st-busy{border-left:1px solid var(--line)}
.pcard.st-over{border-color:transparent}
.pcard.st-available{box-shadow:inset 3px 0 0 var(--green),var(--shadow)}
.pcard.st-break{box-shadow:inset 3px 0 0 var(--amber),var(--shadow)}
.pcard.st-over{box-shadow:inset 3px 0 0 var(--red),var(--shadow)}
.pcard.st-busy{box-shadow:inset 3px 0 0 var(--muted),var(--shadow)}
.bcard{border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.bcard:hover:not(:disabled){border-color:var(--ink)}
.ms-hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal-d{border-radius:12px}
.cal-d.today{border-color:var(--ink)}
.side button svg{color:inherit;opacity:.75}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;flex-direction:column;gap:10px;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .sb-logo{flex-direction:row;align-items:center;justify-content:space-between}
  .sb-logo span{display:none}
  .sidebar .side{order:0;flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:none}
  .sidebar .side::-webkit-scrollbar{display:none}
  .side-head{display:none}
  .side button{width:auto;white-space:nowrap}
  .sb-foot{flex-direction:row;align-items:center;justify-content:space-between;padding-top:10px;flex-wrap:wrap}
  .sb-shift{flex:1 1 100%}
  .content{padding:18px 14px 40px}
  .hero{grid-template-columns:1fr;padding:20px}
}
</style>
</head>
<body>
<section id="login" hidden>
  <div class="login-top"><button class="btn small theme-btn" data-theme-toggle><span class="sw"></span><span class="tl">Night mode</span></button></div>
  <div class="login-card">
    <img class="logo" src="/logo.png" alt="Applied AI">
    <h1>Opus Support Attendance</h1>
    <p class="lead">Sign in with your work email. We send you a one-time code.</p>
    <div id="lStep1">
      <label class="f">Work email<input id="lEmail" type="email" autocomplete="email" inputmode="email" placeholder="name@company.com"></label>
      <button class="btn primary big" id="lSend">Send code</button>
      <div class="err" id="lMsg" role="alert"></div>
    </div>
    <div id="lStep2" hidden>
      <p class="small muted" style="margin:0 0 12px">Code sent to <b id="lSent"></b>. Check your inbox and spam folder.</p>
      <label class="f">Code<input id="lCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
      <button class="btn primary big" id="lVerify">Sign in</button>
      <div class="err" id="lMsg2" role="alert"></div>
      <button class="linkbtn" id="lBack">Use a different email or resend the code</button>
    </div>
  </div>
</section>
<div class="shell" id="app" hidden>
  <aside class="sidebar">
    <div class="sb-logo"><img class="logo" src="/logo.png" alt="Applied AI"><span>Opus Support<br>Attendance</span></div>
    <nav class="side" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="sb-foot">
      <div class="sb-shift" id="sbShift" hidden></div>
      <div class="sb-user" id="who"></div>
      <div class="sb-actions"><button class="btn small theme-btn" data-theme-toggle><span class="sw"></span><span class="tl">Night mode</span></button><button class="btn small" id="signout">Sign out</button></div>
    </div>
  </aside>
  <div class="content">
    <header class="pagehead"><h1 id="pgTitle"></h1><p id="pgSub"></p></header>
    <div id="alertbar" class="alertbar" role="alert" hidden></div>
    <main id="main"></main>
  </div>
</div>
<dialog id="exDlg" class="dlg" aria-labelledby="exTitle">
  <form method="dialog" class="dlg-x"><button class="btn small" aria-label="Close">Close</button></form>
  <h2 id="exTitle">Excuse</h2>
  <p class="small muted" id="exWhen" style="margin:-8px 0 14px"></p>
  <label class="f">Reason (optional)<input id="exReason" maxlength="120" placeholder="Example: doctor appointment, approved leave"></label>
  <p class="hint">Excused days get no late, absent or black points, and do not break the on-time streak.</p>
  <div class="actions"><button class="btn no" id="exRemove" hidden>Remove excuse</button><button class="btn primary" id="exSave">Mark excused</button></div>
  <p class="err" id="exErr" role="alert"></p>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script> -->
<script src="/demo.js"></script>
<script src="/app.js"></script>
</body>
